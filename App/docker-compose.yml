# Local development stack.
#   docker compose up -d postgres elasticsearch      # infrastructure only (run API/UI natively)
#   docker compose up -d --build                     # everything
#
# The Markdown corpus is mounted read-only from HOST_DATA_DIR (see .env).
# Ollama (optional LLM) runs on the host; containers reach it via host.docker.internal.

name: okc

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okc}
      POSTGRES_DB: ${POSTGRES_DB:-okc}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okc} -d ${POSTGRES_DB:-okc}"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # local development only; bound to 127.0.0.1
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports: ["127.0.0.1:9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-okc}:${POSTGRES_PASSWORD:-okc}@postgres:5432/${POSTGRES_DB:-okc}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATA_DIR: /data/markdown
      CONFIG_DIR: /app/config
      EVALUATION_DIR: /app/evaluation
      OLLAMA_HOST: ${OLLAMA_HOST_FROM_DOCKER:-http://host.docker.internal:11434}
      MODEL_CACHE_DIR: /models
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    volumes:
      - ${HOST_DATA_DIR:-./data/sample}:/data/markdown:ro
      - ./config:/app/config:ro
      - ./evaluation:/app/evaluation
      - models:/models
    ports: ["127.0.0.1:8001:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  ui:
    # The main UI (Streamlit, Northfield design). Talks to the backend over HTTP.
    build: ./ui
    environment:
      API_URL: http://backend:8000
      OLLAMA_HOST: ${OLLAMA_HOST_FROM_DOCKER:-http://host.docker.internal:11434}
    volumes: [uistate:/ui/state]
    ports: ["127.0.0.1:8502:8501"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [backend]

  frontend:
    # Earlier Next.js UI, kept for reference: docker compose --profile nextjs up -d frontend
    profiles: ["nextjs"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]

volumes:
  uistate:
  pgdata:
  esdata:
  models:
